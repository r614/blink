[package]
name = "probe_launch"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Start the original Dishonored.exe suspended, inject dishonored_probe_dll, and drive / measure it over the probe pipe (launch needs --target i686-pc-windows-msvc)"

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
dishonored_probe = { path = "../../crates/dishonored_probe" }
# Scenario specs, traces and the oracle cache the captures are written into.
dishonored_oracle.workspace = true
# Layout maps (maps/*.ron) built in the original.
dishonored_ir.workspace = true
glam.workspace = true
ron = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
