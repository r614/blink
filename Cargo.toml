[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
# Ghidra scripts of the oracle's static index (Java, not a crate).
exclude = ["tools/ghidra_index", "vendor"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
lzokay-native = "0.1"
glam = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ue3_package = { path = "crates/ue3_package" }
dishonored_ir = { path = "crates/dishonored_ir" }
dishonored_assets = { path = "crates/dishonored_assets" }
dishonored_world = { path = "crates/dishonored_world" }
dishonored_sim = { path = "crates/dishonored_sim" }
dishonored_net = { path = "crates/dishonored_net" }
dishonored_content = { path = "crates/dishonored_content" }
dishonored_multiplayer = { path = "crates/dishonored_multiplayer" }
dishonored_bots = { path = "crates/dishonored_bots" }
dishonored_ai = { path = "crates/dishonored_ai" }
dishonored_mission = { path = "crates/dishonored_mission" }
dishonored_conversation = { path = "crates/dishonored_conversation", default-features = false }
dishonored_kismet = { path = "crates/dishonored_kismet", default-features = false }
dishonored_settings = { path = "crates/dishonored_settings" }
dishonored_save = { path = "crates/dishonored_save" }
dishonored_fx = { path = "crates/dishonored_fx" }
dishonored_anim = { path = "crates/dishonored_anim" }
dishonored_oracle = { path = "crates/dishonored_oracle" }

[profile.dev]
opt-level = 1
# File and line in backtraces without full debug info: much less for the linker to process.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Release builds the workspace crates incrementally in many units (a change to the game crate
# rebuilds in a fraction of the full time); dependencies keep the default release settings, so
# their compiled artifacts stay cached. Distribution zips use `--profile dist` (full optimisation).
[profile.release]
incremental = true
codegen-units = 256

[profile.release.package."*"]
incremental = false
codegen-units = 16

[profile.dist]
inherits = "release"
incremental = false
codegen-units = 16

# Optimised builds for the harness and local testing: release speed, built in more parallel
# units and incrementally. `cargo build --profile fast-release` (output in target/fast-release).
# Distribution zips still use the plain release profile.
[profile.fast-release]
inherits = "release"
codegen-units = 256
incremental = true

# bevy_render 0.19.1 with a persistent wgpu pipeline cache (vendor/bevy_render, [blink patch]).
[patch.crates-io]
bevy_render = { path = "vendor/bevy_render" }
