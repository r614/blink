[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
lzokay-native = "0.1"
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ue3_package = { path = "crates/ue3_package" }
dishonored_ir = { path = "crates/dishonored_ir" }
dishonored_assets = { path = "crates/dishonored_assets" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
