[package]
name = "dishonored_runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Bevy presentation runtime: renders imported Dishonored maps"

[features]
# Per-system CPU spans written as a Chrome trace (`trace-*.json` in the working directory);
# see research/dishonored/RENDERING.md "Performance".
trace = ["bevy/trace_chrome"]

# The crate is a library plus a thin binary; its tests live in tests/ and link the normal
# library build, so the library and binary have no test builds of their own (no second compile
# of this large crate on `cargo test`).
[lib]
test = false
doctest = false

[[bin]]
name = "dishonored_runtime"
path = "src/main.rs"
test = false

[dependencies]
anyhow.workspace = true
bevy = { version = "0.19", features = ["pbr_specular_textures"] }
# the original-shader programs composed with Bevy's imports off the render thread and cached on
# disk (ue3_shader_cache.rs); the versions Bevy 0.19.1 / wgpu 29 use
naga = { version = "29", features = ["wgsl-in", "wgsl-out", "spv-in", "spv-out"] }
naga_oil = { version = "0.22", default-features = false }
dishonored_assets.workspace = true
ue3_package.workspace = true
ue3_shader = { path = "../ue3_shader" }
dishonored_ir.workspace = true
dishonored_sim.workspace = true
dishonored_world.workspace = true
dishonored_content.workspace = true
dishonored_multiplayer.workspace = true
dishonored_mission.workspace = true
dishonored_settings.workspace = true
dishonored_save.workspace = true
dishonored_net.workspace = true
dishonored_bots.workspace = true
dishonored_audio = { path = "../dishonored_audio" }
# [interp] matinee data for cutscenes
dishonored_kismet = { workspace = true, features = ["load"] }
# [journal] story flag names of the mission stats' summary items
dishonored_conversation = { workspace = true, features = ["load"] }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = "0.15"
